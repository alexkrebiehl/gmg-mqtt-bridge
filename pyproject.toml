[project]
name = "gmg-mqtt-bridge"
version = "0.1.0"
description = "Read a Green Mountain Grill's local status and publish it to Home Assistant via MQTT discovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiomqtt>=2.5,<3.0",
]

[project.scripts]
gmg-mqtt-bridge = "gmg_mqtt_bridge.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmg_mqtt_bridge"]
